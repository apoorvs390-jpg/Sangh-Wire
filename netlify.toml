[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Make /api/news work on Netlify too (same URL as on Vercel)
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

# Password login on Netlify (same URL as on Vercel)
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200
